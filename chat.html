<body class="chat-body">

  <div class="chat-page">
    <!-- Ambient Glows -->
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
    <div class="glow glow-3"></div>

    <!-- Top Bar -->
    <header class="chat-header">
      <a href="index.html" class="chat-back" aria-label="Back to Dashboard">
        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.5" fill="none">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
        ← Back to Dashboard
      </a>
      <div class="chat-brand">
        <img src="assets/avatar.png" alt="Anees Avatar" class="chat-avatar" />
        <div class="chat-brand-txt">
          <strong>Anees AI</strong>
          <span class="chat-status"><span class="pulse-dot-sm"></span>Online</span>
        </div>
      </div>
      <button class="chat-clear-btn" id="chatClearBtn" title="Reset Conversation Memory & Clear Screen" aria-label="Clear chat history">
        <svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2.2" fill="none" style="margin-right:5px; vertical-align:-2px;">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        </svg>
        Clear Chat
      </button>
    </header>

    <!-- Messages Area -->
    <main class="chat-messages" id="chatMessages" aria-live="polite">
      <!-- Welcome message -->
      <div class="chat-bubble ai">
        <div class="bubble-avatar">
          <img src="assets/avatar.png" alt="AI" />
        </div>
        <div class="bubble-content">
            <p>Hello! 👋 I'm Anees's AI Digital Twin. How can I help you today?</p>
        </div>
      </div>

      <!-- Quick Prompt Chips -->
      <div class="chat-chips" id="chatChips">
        <button class="chip" data-prompt="What are your core AI skills?">🧠 Core AI Skills</button>
        <button class="chip" data-prompt="Tell me about your Easy-Study RAG project">📚 Easy-Study RAG</button>
        <button class="chip" data-prompt="What is your work experience?">💼 Experience</button>
        <button class="chip" data-prompt="Are you available for hire?">✅ Availability</button>
        <button class="chip" data-prompt="What technologies do you use for backend APIs?">⚙️ Backend Stack</button>
        <button class="chip" data-prompt="Tell me about your computer vision projects">👁️ Computer Vision</button>
      </div>
    </main>

    <!-- Input Bar -->
    <footer class="chat-input-bar">
      <form class="chat-form" id="chatForm" autocomplete="off">
        <input
          type="text"
          id="chatInput"
          placeholder="Ask Anees anything..."
          aria-label="Chat message"
          maxlength="1000"
          required
        />
        <button type="submit" id="chatSend" aria-label="Send message">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </form>
      <p class="chat-disclaimer">AI Digital Twin · Answers based on Anees's professional profile · <a href="privacy.html" target="_blank" style="color:#64748b;text-decoration:underline;">Privacy Policy</a></p>
    </footer>
  </div>

  <script src="chat.js?v=23" defer></script>
</body>
