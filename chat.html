  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "@id": "https://aneesportfolio.com/chat.html#app",
    "name": "Anees AI Digital Twin Chat",
    "applicationCategory": "BusinessApplication",
    "operatingSystem": "Web, Windows, Linux, Android, iOS",
    "description": "Interactive, real-time AI Digital Twin of Anees Munir Khokhar, powered by Groq Llama-3.3-70b with a 3-Layer Security Shield and Local FAISS/Scikit-Learn RAG Engine.",
    "creator": {
      "@type": "Person",
      "@id": "https://aneesportfolio.com/#person",
      "name": "Anees Munir Khokhar"
    },
    "featureList": [
      "Layer 1 Pre-Flight Multi-Pass Regex Security Shield against Prompt Injections",
      "Layer 2 In-Flight Immutable System Identity Lock",
      "Layer 3 Post-Flight Hallucination & Persona Hijacking Audit",
      "Local Hybrid Vector RAG Engine (FAISS + Scikit-Learn TF-IDF Cosine Similarity)",
      "Bilingual Support (English, Urdu, and Roman Urdu)"
    ]
  }
  </script>

<body class="chat-body">

  <div class="chat-page">
    <!-- Ambient Glows -->
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
    <div class="glow glow-3"></div>

    <!-- Top Bar -->
    <header class="chat-header">
      <a href="index.html" class="chat-back" aria-label="Back to Portfolio">
        <span class="back-icon">←</span>
        <span class="back-txt">Back</span>
      </a>
      <div class="chat-brand">
        <img src="assets/avatar.png" alt="Anees Avatar" class="chat-avatar" />
        <div class="chat-brand-txt">
          <strong>Anees AI</strong>
          <span class="chat-status"><span class="pulse-dot-sm"></span>Online</span>
        </div>
      </div>
      <div class="chat-header-right">
        <label class="mind-mode-toggle" title="Show AI reasoning trace">
          <input type="checkbox" id="mindModeToggle" />
          <span class="toggle-slider"></span>
          <span class="toggle-label">⚙️ Mind</span>
        </label>
        <label class="mind-mode-toggle tts-mode-toggle" title="Enable AI Voice Audio Output (TTS)">
          <input type="checkbox" id="ttsModeToggle" />
          <span class="toggle-slider"></span>
          <span class="toggle-label">🔊 Voice</span>
        </label>
        <button class="chat-clear-btn" id="chatClearBtn" title="Reset Conversation Memory & Clear Screen" aria-label="Clear chat history">
          <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2.2" fill="none" style="margin-right:4px; vertical-align:-2px;">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
          Clear
        </button>
      </div>
    </header>

    <!-- Messages Area -->
    <main class="chat-messages" id="chatMessages" aria-live="polite">
      <!-- Welcome message -->
      <div class="chat-bubble ai">
        <div class="bubble-avatar">
          <img src="assets/avatar.png" alt="AI" />
        </div>
        <div class="bubble-content">
            <p>Hello! 👋 I'm Anees's AI Digital Twin. How can I help you today?</p>
        </div>
      </div>

      <!-- Quick Prompt Chips (4 Essential Chips in 2 Clean Rows) -->
      <div class="chat-chips" id="chatChips">
        <button class="chip chat-chip" data-prompt="What are your core AI skills?">🧠 Core AI Skills</button>
        <button class="chip chat-chip" data-prompt="Tell me about your Easy-Study RAG project">📚 Easy-Study RAG</button>
        <button class="chip chat-chip" data-prompt="What is your work experience?">💼 Experience</button>
        <button class="chip chat-chip" data-prompt="Are you available for hire?">✅ Availability</button>
      </div>
    </main>

    <!-- Input Bar -->
    <footer class="chat-input-bar">
      <form class="chat-form" id="chatForm" autocomplete="off">
        <input
          type="text"
          id="chatInput"
          placeholder="Ask Anees anything..."
          aria-label="Chat message"
          maxlength="1000"
          required
        />
        <button type="button" id="micBtn" class="mic-btn" aria-label="Voice input" title="Speak to Anees AI">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="1" width="6" height="11" rx="3"/>
            <path d="M19 10v1a7 7 0 0 1-14 0v-1"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
        </button>
        <button type="submit" id="chatSend" aria-label="Send message">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </form>
      <p class="chat-disclaimer">AI Digital Twin · Answers based on Anees's professional profile · <a href="privacy.html" target="_blank" style="color:#64748b;text-decoration:underline;">Privacy Policy</a></p>
    </footer>
  </div>

  <script src="voice_recorder.js?v=110" defer></script>
  <script src="chat.js?v=110" defer></script>
</body>
</html>
