name: 🛡️ AI Digital Twin Security & RAG CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  security-and-rag-suite:
    name: 🧪 Automated Red-Team & RAG Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Execute Layer 1-3 Security & RAG Regression Tests
        run: |
          python -m unittest -v backend.tests.test_shield backend.tests.test_rag

  docker-build-and-smoke-test:
    name: 🐳 Docker Container Build & Smoke Verification
    needs: security-and-rag-suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Build Docker Container
        run: docker build -t anees-ai-twin:latest .

      - name: Run Container Smoke Test (GET /health)
        run: |
          docker run --rm -d -p 8000:8000 --name test-twin -e GROQ_API_KEY="gsk_dummy_test_key" anees-ai-twin:latest
          sleep 5
          curl --fail --retry 3 --retry-delay 2 http://localhost:8000/health
          docker stop test-twin
